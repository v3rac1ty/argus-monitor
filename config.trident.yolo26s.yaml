# Argus Monitor configuration for a Voron Trident, running the fine-tuned
# YOLO26s-cls binary (failure/normal) whole-frame classifier -- the model
# targeted at the Raspberry Pi 5 AI HAT+ (Hailo-8, 26 TOPS). This is a
# sibling of config.trident.yaml (which runs the incumbent ResNet18 model on
# CPU), not a replacement for it -- keep both until the Hailo HEF path in
# docs/hailo-deployment.md is compiled and re-validated on real hardware.
#
# Calibrated against the real measured artifacts:
#   - models/yolo26s_cls_bin_finetuned.onnx           (fine-tuned, opset 12, see below)
#   - models/yolo26s_cls_bin_finetuned_opset11.onnx    (opset-11 conversion of the above via
#     onnx.version_converter -- 100% argmax agreement / 0.0 max abs diff with the opset-12
#     model on all 331 test images, so every number below applies unchanged to this file)
#   - runs/eval_yolo26s_finetuned_opset11.json         (test-split evaluation report, reproduced
#     on this exact opset-11 file)
#   - runs/eval_yolo26s_finetuned_zerofp_pinpoint.json (0.70-0.95 confidence sweep that located
#     the zero-false-positive threshold used below)
#
# Provenance: models/yolo26s_cls_bin.onnx (the Ultralytics YOLO26s-cls export,
# opset 12) was fine-tuned directly in tinygrad -- training/finetune_yolo_tinygrad.py,
# which imports the ONNX graph via tinygrad's own ONNX runner and trains it in place
# (batch 32, lr 1e-4, early-stopping patience 8 on validation macro-F1; NOT the same
# "patience 8" as the earlier, buggy Ultralytics retrain below -- this is the tinygrad
# fine-tune loop's own early-stop patience) -- best val macro-F1 0.9675 at epoch 9 of
# 40, see runs/logs/finetune_yolo_tinygrad_metal.log. This beats every Ultralytics
# retrain of the same architecture on the metric that matters for an automated
# print-pause signal -- zero false positives at a usable recall:
#
#   | Model                                    | Test top-1 | Failure P / R | FP/236 | Zero-FP thresh | Recall there |
#   |-------------------------------------------|-----------|---------------|--------|-----------------|--------------|
#   | ResNet18 (models/argus_bin_opset11.onnx)   | 0.9637    | 0.988 / 0.884 | 1      | 0.75            | 0.674        |
#   | YOLO26s Ultralytics retrain (yolo26s_cls_bin_v2, models/yolo26s_cls_bin_opset11.onnx) | 0.9789 | 0.968 / 0.958 | 3 | 0.99723 (0.00005-wide window; INT8-unrepresentable) | 0.779 |
#   | YOLO26s tinygrad fine-tune, patience 30     | higher val F1 | --        | --     | 0.95            | 0.242 (rejected: recall collapses) |
#   | **YOLO26s tinygrad fine-tune, patience 8 (THIS FILE)** | **0.9849** | **0.979 / 0.968** | **2** | **~0.78 (30-point-wide window, 0.775-0.805)** | **0.968** |
#
# This model is the deployment target: highest test top-1, best zero-FP
# recall, and -- unlike the Ultralytics retrain's 0.99723 -- a zero-FP window
# wide enough to survive INT8 requantization shifting the confidence
# distribution a little (see docs/hailo-deployment.md's mandatory
# post-quantization re-derivation section; the window being wide is not a
# reason to skip that step, only a reason it is more likely to still exist
# afterward).
#
# Any string value of the exact form "env:VAR_NAME" is replaced at load time
# with os.environ["VAR_NAME"] (or None if that variable is unset). Use this
# to keep secrets such as the Discord webhook URL out of version control.

# Camera capture: where frames come from and at what size/rate.
camera:
  source: "0"              # "0"=/dev/video0, an http(s) MJPEG/snapshot URL, or a directory path for replay
  width: 1280
  height: 720
  fps: 5
  reconnect_backoff_s: 2.0
  max_reconnect_backoff_s: 30.0

# ONNX detector: models/yolo26s_cls_bin_finetuned_opset11.onnx, a whole-frame
# binary classifier (failure vs. normal), fine-tuned in tinygrad then
# converted to opset 11 (mandatory for Hailo's ONNX parser -- see
# docs/hailo-deployment.md) via onnx.version_converter (100% argmax
# agreement / 0.0 max abs diff with the opset-12 fine-tuned model on all 331
# test images -- see runs/eval_yolo26s_finetuned_opset11.json). Runs on ONNX
# Runtime/CPU today; switching to the Hailo-8 NPU is the commented-out
# "kind: hailo" block below, a one-line change once the .hef is compiled
# (see docs/hailo-deployment.md).
#
# class_thresholds and severity must list exactly the same class names --
# every class needs both a threshold and a severity, or config loading will
# fail (see argus.config._validate, which checks
# set(class_thresholds) == set(severity)).
detector:
  kind: "classification"
  model_path: "models/yolo26s_cls_bin_finetuned_opset11.onnx"
  # Model is exported with a STATIC input of (1, 3, 320, 320); ClassifierDetector
  # reads the static shape straight off the ONNX graph and this value is only
  # the fallback if that ever fails, but it must still match the training/export
  # size.
  input_size: 320
  providers: ["CPUExecutionProvider"]
  # This order is not arbitrary -- it is the model's REAL output index order,
  # embedded in the ONNX metadata itself. Read directly off
  # models/yolo26s_cls_bin_finetuned_opset11.onnx via onnxruntime's own
  # get_modelmeta().custom_metadata_map["names"] for this file (not assumed
  # from Ultralytics' usual alphabetical convention, though it happens to
  # agree here): "{0: 'failure', 1: 'normal'}". Input node is "images"
  # (1,3,320,320 float32 NCHW, [0,1]-scaled); output node is "output0"
  # (1,2), and -- unlike the ResNet18/tinygrad-from-scratch ONNX path's
  # "logits" output -- this graph's own final op is a Softmax, so output0 is
  # ALREADY a valid probability distribution (verified: sums to 1.0 on a
  # random input), not raw logits. argus.detectors.classifier.resolve_class_names()
  # cross-checks this list against the same metadata at load time and raises
  # ValueError on any mismatch, so getting this order wrong fails loudly at
  # startup rather than silently mislabeling every prediction.
  class_names: ["failure", "normal"]
  default_threshold: 0.50
  class_thresholds:
    # 0.78 is not a round-number guess -- it is a measured value from
    # runs/eval_yolo26s_finetuned_zerofp_pinpoint.json's confidence sweep
    # (0.70-0.95 in 0.005 steps): on the 331-image held-out test split,
    # false positives on the 236 normal images drop from 1 to 0 exactly at
    # threshold 0.775, and recall holds at 0.968 (92/95 failures caught)
    # all the way to 0.805 before the next failure drops out at 0.81. 0.78
    # sits in that ~30-point-wide zero-FP/recall-0.968 window, giving
    # PRECISION 1.000 / ZERO false positives with recall 0.968 intact.
    #
    # Unlike the earlier Ultralytics-retrain model's 0.99723 (a
    # 0.00005-wide window pinned against the softmax ceiling), this
    # threshold sits mid-range, which INT8's ~256 quantization levels can
    # actually represent. That does NOT mean quantization is free to
    # ignore: INT8 still shifts the confidence distribution the model
    # produces, so this value MUST still be re-derived on the compiled
    # Hailo HEF before deployment -- see docs/hailo-deployment.md's
    # mandatory re-derivation section for the exact command. If the
    # quantized model can't hold a usable zero-FP threshold, fall back to
    # the ResNet18 model (config.trident.yaml, threshold 0.75, measured
    # with real margin on both sides of its own zero-FP boundary).
    failure: 0.78
    # Never consulted: postprocess_classify() short-circuits any "normal"
    # argmax to zero detections before any threshold is checked (see
    # ClassifierDetector module docstring). Listed only because
    # class_thresholds and severity must define exactly the same class-name
    # set, or argus.config.ConfigError is raised at load time.
    normal: 0.50
  severity:
    # The only catastrophic class -- a "failure" prediction above threshold
    # is the sole signal that can ever reach the DecisionEngine's p_failure
    # (see DetectionResult.p_failure: max confidence among CATASTROPHIC
    # detections only).
    failure: catastrophic
    # Never consulted at runtime (see class_thresholds.normal above for why
    # it's still listed) -- a "normal" prediction produces zero Detections,
    # not a cosmetic one.
    normal: cosmetic

# -----------------------------------------------------------------------
# Future: once the Hailo-8 .hef is compiled (docs/hailo-deployment.md) and
# its OWN zero-FP threshold has been re-derived on-device (mandatory -- INT8
# quantization shifts the confidence distribution, see the warning above and
# docs/hailo-deployment.md), switching to the Hailo-8 NPU is this one block
# replacing the "detector:" section above, nothing else in this file changes:
# -----------------------------------------------------------------------
# detector:
#   kind: "hailo"
#   model_path: "models/yolo26s_cls_bin.hef"
#   input_size: 320
#   class_names: ["failure", "normal"]   # same order as above -- a compiled HEF carries no
#                                         # embedded metadata for HailoDetector to cross-check
#                                         # against, so this MUST match the ONNX export's real
#                                         # order (verified above) or every prediction is
#                                         # silently mislabeled with no error at load time.
#   default_threshold: 0.50
#   class_thresholds:
#     failure: 0.78   # PLACEHOLDER ONLY -- re-derive on the quantized model per
#                      # docs/hailo-deployment.md's mandatory re-derivation section before
#                      # trusting this. INT8 quantization shifts the confidence distribution
#                      # of every model it quantizes; this fp32 value carried over unmodified
#                      # is a starting guess, not a validated operating point.
#     normal: 0.50
#   severity:
#     failure: catastrophic
#     normal: cosmetic

# Temporal DecisionEngine: turns a stream of per-frame classifier scores into
# a smoothed score and, eventually, an action (notify / pause / cancel).
#
# UNCHANGED from config.trident.yaml, carried over as-is -- NOT re-calibrated
# for this model. tools/calibrate.py's sweep that picked these values (see
# config.trident.yaml's own comment) was run against the ResNet18 model's
# raw p_failure signal, which ranges from 0.75 (its own class_thresholds.failure)
# up to 1.0. This model's raw p_failure signal instead only ever appears in
# the narrower [0.78, 1.0] band (anything below the detector's own threshold
# is already zeroed out before the DecisionEngine ever sees it) -- pause_score
# (0.75) and warn_score (0.60) are trivially cleared by the FIRST raw positive
# tick this model ever produces, which changes the qualitative
# vote-accumulation behavior these values were tuned for (cancel_score, 0.92,
# is not trivially cleared and is disabled by cancel_enabled: false below
# regardless). Re-run tools/calibrate.py against this model's own real
# p_failure distribution before enabling anything beyond notify_only.
decision:
  tick_interval_s: 1.0
  warmup_s: 180
  ema_alpha: 0.35
  window: 12
  vote_threshold: 0.55
  warn_score: 0.60
  warn_votes: 4
  pause_score: 0.75
  pause_votes: 6
  pause_consecutive: 3
  cancel_score: 0.92
  cancel_votes: 9
  cancel_consecutive: 2
  cancel_enabled: false
  clear_score: 0.40
  clear_ticks: 5
  cooldown_s: 300
  # notify_only MUST ship as the default here, for at least two independent
  # reasons: (1) the same real-footage-calibration gap config.trident.yaml
  # documents (these are public-dataset stills, not recorded Voron Trident
  # footage), and (2) decision: above is carried over unmodified and, per
  # the comment there, has not been re-calibrated for this model's own
  # compressed-band p_failure signal ([0.78, 1.0], not the ResNet18 model's
  # [0.75, 1.0] these values were tuned against). Do not raise this above
  # notify_only until both gaps are closed.
  action_mode: "notify_only"   # notify_only | pause | cancel -- ceiling on automated action

# Pre-inference frame quality gate: reject frames too dark/bright/blurry/stale
# to trust, rather than feeding garbage into the detector and decision engine.
quality:
  min_mean_luma: 20.0
  max_mean_luma: 240.0
  min_blur_var: 45.0
  max_frame_age_s: 5.0

# Moonraker (Klipper API) connection used to poll print state and, if
# action_mode allows it, pause/cancel the print.
moonraker:
  base_url: "http://localhost:7125"
  timeout_s: 5.0
  poll_interval_s: 1.0
  pause_macro: null        # e.g. "DETECTION_PAUSE" to call a gcode macro instead of the raw pause endpoint

# Discord webhook notifications. discord_webhook_url is loaded from the
# DISCORD_WEBHOOK_URL environment variable so it never ends up committed.
notify:
  discord_webhook_url: "env:DISCORD_WEBHOOK_URL"
  attach_frame: true
  min_interval_s: 60

# Local storage: where the JSONL event log and captured frames are written,
# and how much of that to keep.
storage:
  event_log: "logs/events.jsonl"
  frame_dir: "captures"
  max_frames: 500
  retention_days: 14

logging:
  level: "INFO"
