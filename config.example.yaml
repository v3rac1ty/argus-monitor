# Argus Monitor configuration.
#
# Copy this file (e.g. to config.yaml) and edit as needed, then run:
#   argus --config config.yaml
#
# Any string value of the exact form "env:VAR_NAME" is replaced at load time
# with os.environ["VAR_NAME"] (or None if that variable is unset). Use this
# to keep secrets such as the Discord webhook URL out of version control.

# Camera capture: where frames come from and at what size/rate.
camera:
  source: "0"              # "0"=/dev/video0, an http(s) MJPEG/snapshot URL, or a directory path for replay
  width: 1280
  height: 720
  fps: 5
  reconnect_backoff_s: 2.0
  max_reconnect_backoff_s: 30.0

# ONNX detector: model location, preprocessing, and per-class confidence
# thresholds. class_thresholds and severity must list exactly the same class
# names -- every class needs both a threshold and a severity, or config
# loading will fail.
#
# kind selects which detector implementation is built: "detection" (below,
# the active default) for the ONNX object detector, or "classification" for
# a whole-frame ONNX classifier -- see the commented-out block near the
# bottom of this section for how to switch. The DecisionEngine only ever
# consumes p_failure (never bounding boxes), so either path is a drop-in
# replacement for the other; nothing outside this section needs to change.
detector:
  kind: "detection"
  model_path: "models/argus_multi.onnx"
  input_size: 640          # model is trained and exported at 640x640
  providers: ["CPUExecutionProvider"]
  # Output contract of the ONNX model. Two supported models produce two
  # different raw output shapes:
  #   - "auto"    (default) auto-detect from the model's output shape at
  #                load time: raw YOLOv8 predictions "(1, 4+nc, N)" (or its
  #                transpose) vs. YOLO26's decoded, NMS-free end-to-end
  #                output "(1, 300, 6)". Safe for our 5-class model, where
  #                the two shapes can't be confused.
  #   - "yolov8"   force the legacy YOLOv8 raw-prediction contract
  #                (transpose + argmax + class-aware NMS applied here).
  #   - "end2end"  force YOLO26's decoded contract (already-NMS'd
  #                [x1, y1, x2, y2, confidence, class_id] rows -- no NMS is
  #                applied here).
  # NOTE: if you ever train with exactly 2 classes, 4+nc == 6 and "auto"
  # can no longer tell the two layouts apart by shape alone (it will prefer
  # "yolov8"); pin this explicitly in that case.
  layout: "auto"
  nms_iou: 0.45
  default_threshold: 0.50
  # PLACEHOLDERS -- NOT YET MEASURED for the 7-class model.
  # training/evaluate.py picks each class's threshold to hit precision >= 0.95
  # on the held-out test split and must be re-run after every retrain; these
  # numbers are specific to one set of weights, never general defaults.
  # Until that run happens these are deliberately conservative (high = fires
  # less often), and decision.action_mode stays notify_only, so an
  # uncalibrated threshold cannot stop a print.
  class_thresholds:
    spaghetti: 0.75         # placeholder -- re-derive
    layer_separation: 0.75  # placeholder -- re-derive
    bed_adhesion: 0.75      # placeholder -- re-derive
    blob_of_death: 0.75     # placeholder -- re-derive
    warping: 0.50           # placeholder -- re-derive
    stringing: 0.50         # placeholder -- re-derive
    error_extrusion: 0.50   # placeholder -- re-derive
  # Severity gates which classes may drive automated action (see
  # decision.action_mode below). Cosmetic classes are still detected and
  # logged; they just cannot trigger a pause/cancel.
  #
  # The catastrophic set is a policy decision about which failures justify
  # stopping a print, independent of how well the model currently detects
  # them. All four destroy the part or risk the machine: spaghetti, a print
  # detaching from the bed, delamination between layers, and a blob
  # engulfing the hotend. Thresholds, not severity, are what stop a
  # weakly-detected class from firing.
  #
  # warping stays cosmetic. It was demoted after the 5-class model showed
  # P=0.951 at recall 0.065 -- roughly two true detections out of 31
  # instances, which is noise rather than evidence. Promote it only once a
  # retrained model earns it on a materially larger warping sample.
  severity:
    spaghetti: catastrophic
    layer_separation: catastrophic
    bed_adhesion: catastrophic
    blob_of_death: catastrophic
    warping: cosmetic
    stringing: cosmetic
    error_extrusion: cosmetic

  # --- Classification path ------
  # A classifier predicts one whole-frame label per frame instead of boxes.
  # The DecisionEngine only ever consumes p_failure, never bounding boxes,
  # so this is a drop-in replacement for the detection path above -- flip
  # `kind` and point model_path/input_size/class_names at your classifier to
  # switch. To actually use this, delete the "detection" block above (or set
  # its keys as shown here) -- only one `detector:` section is read.
  #
  # kind: "classification"
  # model_path: "models/argus_classifier.onnx"
  # input_size: 512          # must match the classifier's training-time input size
  # providers: ["CPUExecutionProvider"]
  # class_names: ["cracking", "layer_shifting", "normal", "spaghetti", "stringing", "warping"]
  # default_threshold: 0.50
  # class_thresholds:
  #   cracking: 0.75
  #   layer_shifting: 0.75
  #   normal: 0.50            # unused: a "normal" prediction short-circuits to zero
  #                           # detections before any threshold is consulted (see
  #                           # ClassifierDetector / postprocess_classify); listed
  #                           # only because class_thresholds and severity below
  #                           # must define exactly the same set of class names.
  #   spaghetti: 0.75
  #   stringing: 0.50
  #   warping: 0.75
  # severity:
  #   # Severity (argus.types) only has catastrophic/cosmetic -- there's no
  #   # "not a defect" value, and types.py is a frozen contract we don't
  #   # touch. So "normal" predictions aren't tagged cosmetic; they're
  #   # excluded entirely (zero Detections, p_failure == 0.0). This entry is
  #   # never actually consulted at runtime -- see class_thresholds.normal
  #   # above for why it's still listed.
  #   #
  #   # spaghetti is the only catastrophic class (able to drive pause/cancel
  #   # -- see decision.action_mode), matching the detection path's severity
  #   # map above and training/evaluate_classifier.py's
  #   # CATASTROPHIC_CLASS_NAME / training/export_classifier_onnx.py's
  #   # _SEVERITY_MAP_NAMES. cracking and layer_shifting are cosmetic-only
  #   # until a retrained model demonstrates real precision for them, same
  #   # reasoning as the detection path's warping demotion above.
  #   cracking: cosmetic
  #   layer_shifting: cosmetic
  #   normal: cosmetic
  #   spaghetti: catastrophic
  #   stringing: cosmetic
  #   warping: cosmetic

# Temporal DecisionEngine: turns a stream of per-frame detections into a
# smoothed score and, eventually, an action (notify / pause / cancel).
#
# These defaults are intentionally conservative -- a false positive kills a
# long print, which is far more costly than reacting a few seconds late to
# a real one. That shows up in several places:
#   - ema_alpha is low-ish (0.35) so a single noisy frame can't swing the
#     smoothed score on its own.
#   - warn/pause/cancel all require BOTH a minimum vote count within the
#     window AND a run of consecutive high-confidence ticks, not just one
#     instant of high score.
#   - cancel_enabled defaults to false and action_mode defaults to
#     notify_only, so out of the box the system only ever notifies a human --
#     it will not touch the print until an operator opts in to pause/cancel.
#   - warmup_s gives the first layers (most failure-prone/least predictive
#     period) time to settle before detection results can trigger anything.
decision:
  tick_interval_s: 1.0
  warmup_s: 180
  ema_alpha: 0.35
  window: 12
  vote_threshold: 0.55
  warn_score: 0.60
  warn_votes: 4
  pause_score: 0.75
  pause_votes: 6
  pause_consecutive: 3
  cancel_score: 0.92
  cancel_votes: 9
  cancel_consecutive: 2
  cancel_enabled: false
  clear_score: 0.40
  clear_ticks: 5
  cooldown_s: 300
  # Measured reality on the current model: spaghetti (the only catastrophic
  # class) reaches only ~0.66 precision at its best real operating point
  # (conf 0.75), i.e. roughly one in three alarms would be a false positive.
  # notify_only is therefore the correct and deliberate default, not a
  # placeholder -- enable pause only after tools/calibrate.py demonstrates
  # an acceptable false-positives-per-hour figure on the user's own
  # recorded prints.
  action_mode: "notify_only"   # notify_only | pause | cancel -- ceiling on automated action

# Pre-inference frame quality gate: reject frames too dark/bright/blurry/stale
# to trust, rather than feeding garbage into the detector and decision engine.
quality:
  min_mean_luma: 20.0
  max_mean_luma: 240.0
  min_blur_var: 45.0
  max_frame_age_s: 5.0

# Moonraker (Klipper API) connection used to poll print state and, if
# action_mode allows it, pause/cancel the print.
moonraker:
  base_url: "http://localhost:7125"
  timeout_s: 5.0
  poll_interval_s: 1.0
  pause_macro: null        # e.g. "DETECTION_PAUSE" to call a gcode macro instead of the raw pause endpoint

# Discord webhook notifications. discord_webhook_url is loaded from the
# DISCORD_WEBHOOK_URL environment variable so it never ends up committed.
notify:
  discord_webhook_url: "env:DISCORD_WEBHOOK_URL"
  attach_frame: true
  min_interval_s: 60

# Local storage: where the JSONL event log and captured frames are written,
# and how much of that to keep.
storage:
  event_log: "logs/events.jsonl"
  frame_dir: "captures"
  max_frames: 500
  retention_days: 14

logging:
  level: "INFO"
